<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <!-- Google tag (gtag.js), with Consent Mode: no analytics cookies until the visitor accepts -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EZKCMTF6E0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      // Consent policy for analytics: one switch per site.
      // 'granted' = no banner, Google Analytics cookies on.
      // 'denied'  = Consent Mode: nothing is stored until the banner calls setAnalyticsConsent('granted').
      var ANALYTICS_CONSENT = 'denied';
      gtag('consent', 'default', {
        analytics_storage: ANALYTICS_CONSENT,
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });
      window.setAnalyticsConsent = function (choice) {
        try {
          localStorage.setItem('analyticsConsent', choice);
        } catch (e) {}
        gtag('consent', 'update', { analytics_storage: choice });
      };
      try {
        // A returning visitor's choice has to be in place before the first page view.
        if (
          ANALYTICS_CONSENT === 'denied' &&
          localStorage.getItem('analyticsConsent') === 'granted'
        ) {
          gtag('consent', 'update', { analytics_storage: 'granted' });
        }
      } catch (e) {}
      gtag('js', new Date());
      gtag('config', 'G-EZKCMTF6E0');
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
