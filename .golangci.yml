version: "2"
run:
  # Paths in the report are relative to the git root, which is how Sonar looks them up.
  relative-path-mode: gitroot
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable: [bodyclose, errorlint, gocritic, misspell, nilerr, unconvert]
  settings:
    errcheck:
      # Clean-up where there is nowhere to send the error.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        # Read-only cursor; the loop's rows.Err() carries any failure.
        - (*database/sql.Rows).Close
        # Fail returns its error argument so a caller can `return m.Fail(...)`.
        - (*github.com/eggs-gd/fleet.eggs.gd/internal/health.Monitor).Fail
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
        text: "\\.Close` is not checked"
issues:
  # Report everything; the default caps hide repeats of the same finding.
  max-issues-per-linter: 0
  max-same-issues: 0
