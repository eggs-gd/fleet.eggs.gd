# SonarQube analysis. The server URL and the token are not stored here: set
# SONAR_HOST_URL and SONAR_TOKEN (a user token) in your environment or in a
# git-ignored .env, then run `make sonar`. See CONTRIBUTING.md.
sonar.projectKey=fleet
sonar.projectName=Fleet
sonar.sourceEncoding=UTF-8

# Go, the dashboard and the landing. Tests live next to the code, so they are
# kept out of the main sources by exclusion and picked up again as tests.
sonar.sources=server,view/src,site/src
sonar.tests=server,view/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.svelte-kit/**,**/*_test.go,**/*.test.ts

# Written by `make sonar`.
sonar.go.coverage.reportPaths=server/coverage.out

# site/src/app.html is the SvelteKit shell: each page sets its own <title>
# through svelte:head, so the rule that wants one in the shell is a false positive.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=site/src/app.html

# The board has a status named `todo`, and the rule that flags TODO comments
# matches the word wherever a comment says it. No comment here is a to-do.
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=server/**

# Tests are long on purpose: table set-up and assertions in one function.
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*_test.go
