name: Feature request
description: Suggest something Fleet should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Fleet makes hard? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you imagine it working. Alternatives you considered are welcome.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Your setup (agents, number of projects), and whether you would help build it.
