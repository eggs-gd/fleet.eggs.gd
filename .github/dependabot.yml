version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /view
    schedule:
      interval: weekly
    groups:
      view-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # svelte-check only runs TypeScript 7 through an experimental tsgo mode
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # svelte-check only runs TypeScript 7 through an experimental tsgo mode
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
