name: Go

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'Makefile'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'Makefile'
      - '.github/workflows/go.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  # Linux is not a supported platform yet. This job reports, it does not gate.

  go-linux:
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test ./... -count=1

  go-race:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race ./internal/server ./internal/execution/... ./internal/settings ./internal/eventbus ./internal/health ./internal/taskflow -count=1

  go-vuln:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  go-staticcheck:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  go-windows-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      GOOS: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go build ./...
