name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which parts of the repository a change touches. The jobs below run
  # only for their own part. They are skipped, not left out, so a required check
  # would still be reported (a workflow-level `paths:` filter leaves checks
  # pending forever). The landing page is deployed by pages.yml, not here.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.filter.outputs.go }}
      view: ${{ steps.filter.outputs.view }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=""
          all=true
          if [ -n "$BASE" ] && ! echo "$BASE" | grep -qE '^0+$' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            all=false
          fi
          match() {
            if [ "$all" = true ] || echo "$files" | grep -qE "$1"; then echo true; else echo false; fi
          }
          echo "go=$(match '^(server/|Makefile$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "view=$(match '^(view/|Makefile$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "site=$(match '^(site/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "changed files:"; echo "$files"

  go-macos:
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  # Linux is not a supported platform yet. This job reports, it does not gate.
  go-linux:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true'
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test ./... -count=1

  go-race:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race ./internal/server ./internal/execution/... ./internal/settings ./internal/eventbus ./internal/health ./internal/taskflow -count=1

  go-vuln:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  go-staticcheck:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  go-windows-build:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true'
    defaults:
      run:
        working-directory: server
    env:
      GOOS: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go build ./...

  dashboard:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.view == 'true'
    defaults:
      run:
        working-directory: view
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: view/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:ui-state
      - run: npm run test:technology-display
      - run: npm run build
      - run: npm audit --omit=dev

  site:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.site == 'true'
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
