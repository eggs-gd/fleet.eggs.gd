name: Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'view/**'
      - 'Makefile'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'view/**'
      - 'Makefile'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: view
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: view/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:ui-state
      - run: npm run test:technology-display
      - run: npm run build
      - run: npm audit --omit=dev
